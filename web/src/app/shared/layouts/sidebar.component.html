<aside class="side">
  <div class="brand">
    <div class="logo"><div class="dot"></div></div>
    <div>
      <div class="name serif">Orbe</div>
      <div class="ver">v1 · maio 2026</div>
    </div>
  </div>

  <nav class="nav">
    @for (item of items; track item.path) {
      <a class="item"
         [routerLink]="item.path"
         routerLinkActive="active">
        <span class="icon">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="caption">Esta semana</div>
  <div class="stats">
    @for (s of weekStats; track s.l) {
      <div class="srow">
        <span>{{ s.l }}</span>
        <span class="v mono">{{ s.v }}</span>
      </div>
    }
  </div>

  <div class="spacer"></div>

  <div class="user">
    <div class="avatar">CR</div>
    <div class="who">
      <div class="n">Cristiano R.</div>
      <div class="p">Plano pessoal</div>
    </div>
  </div>
</aside>
