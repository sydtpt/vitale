<svg [attr.width]="size" [attr.height]="size" viewBox="0 0 24 24" fill="none"
     [attr.stroke]="color" [attr.stroke-width]="strokeWidth"
     stroke-linecap="round" stroke-linejoin="round">
  @switch (name) {
    @case ('check')    { <path d="M4 12l5 5L20 6"/> }
    @case ('plus')     { <path d="M12 5v14M5 12h14"/> }
    @case ('minus')    { <path d="M5 12h14"/> }
    @case ('chev-r')   { <path d="M9 6l6 6-6 6"/> }
    @case ('chev-l')   { <path d="M15 6l-6 6 6 6"/> }
    @case ('chev-d')   { <path d="M6 9l6 6 6-6"/> }
    @case ('home')     { <path d="M3 11l9-8 9 8M5 10v10h14V10"/> }
    @case ('calendar') { <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/> }
    @case ('dumbbell') { <path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/> }
    @case ('fork')     { <path d="M7 3v8a2 2 0 002 2v8M11 3v6M15 3c-1 4 0 8 2 8v10"/> }
    @case ('cart')     { <path d="M3 4h2l2.5 11h11l2-8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/> }
    @case ('broom')    { <path d="M14 4l6 6M9 9l9-9M4 20l5-5M3 21l8-3 4-4-5-5-4 4-3 8z"/> }
    @case ('wallet')   { <rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/> }
    @case ('target')   { <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" [attr.fill]="color"/> }
    @case ('droplet')  { <path d="M12 3s7 7 7 12a7 7 0 11-14 0c0-5 7-12 7-12z"/> }
    @case ('flame')    { <path d="M12 2c1 3-2 4-2 7a4 4 0 008 0c0-1-.5-2-1-3 2 1 4 4 4 8a7 7 0 11-14 0c0-5 5-7 5-12z"/> }
    @case ('run')      { <circle cx="13" cy="4.5" r="1.8"/><path d="M5 21l3-7 4 2 1 5M11 9l-4 1 1 5 5 1 3-5 3 2"/> }
    @case ('yoga')     { <circle cx="12" cy="4.5" r="1.6"/><path d="M12 7v6M5 21c2-5 5-8 7-8s5 3 7 8M8 11h8"/> }
    @case ('book')     { <path d="M4 4h7a3 3 0 013 3v13a3 3 0 00-3-3H4zM20 4h-7a3 3 0 00-3 3v13a3 3 0 013-3h7z"/> }
    @case ('moon')     { <path d="M20 14A8 8 0 1110 4a7 7 0 0010 10z"/> }
    @case ('leaf')     { <path d="M4 20c0-10 8-16 16-16 0 12-6 16-16 16zM4 20l8-8"/> }
    @case ('search')   { <circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/> }
    @case ('bell')     { <path d="M6 8a6 6 0 0112 0v5l2 3H4l2-3zM10 19a2 2 0 004 0"/> }
    @case ('arrow-r')  { <path d="M5 12h14M13 6l6 6-6 6"/> }
    @case ('arrow-u')  { <path d="M12 19V5M6 11l6-6 6 6"/> }
    @case ('arrow-d')  { <path d="M12 5v14M6 13l6 6 6-6"/> }
    @case ('flash')    { <path d="M13 2L4 14h7l-1 8 9-12h-7z"/> }
    @case ('mic')      { <rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/> }
    @case ('camera')   { <rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6l1.5-2h5L16 6"/> }
    @case ('sparkle')  { <path d="M12 3v6M12 15v6M3 12h6M15 12h6M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/> }
    @case ('more')     { <circle cx="5" cy="12" r="1.5" [attr.fill]="color" stroke="none"/><circle cx="12" cy="12" r="1.5" [attr.fill]="color" stroke="none"/><circle cx="19" cy="12" r="1.5" [attr.fill]="color" stroke="none"/> }
    @case ('flag')     { <path d="M5 21V4M5 4h12l-2 4 2 4H5"/> }
    @case ('trend')    { <path d="M3 17l6-6 4 4 8-9M15 6h6v6"/> }
    @case ('pkg')      { <path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5M21 8v8l-9 5M7 6l10 6"/> }
    @case ('bike')     { <circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5M9 9h5l3 8M14 9l-1-4h-2"/> }
    @case ('swim')     { <circle cx="17" cy="6" r="1.6"/><path d="M5 11l4-2 3 2 5-4M3 16c2 1.3 3 1.3 5 0s3-1.3 5 0 3 1.3 5 0M3 20c2 1.3 3 1.3 5 0s3-1.3 5 0 3 1.3 5 0"/> }
    @case ('walk')     { <circle cx="13" cy="4" r="1.6"/><path d="M13 7l-2 5 3 2 2 6M11 12l-3 2-1 4M13 9l3 1"/> }
    @case ('hiking')   { <circle cx="11" cy="4" r="1.6"/><path d="M11 7l-2 5 3 2 1 6M9 12l-3 3M13 9l3 2v8"/> }
  }
</svg>
