@if (buckets().length) {
  <svg [attr.viewBox]="'0 0 ' + w + ' ' + h" class="chart" preserveAspectRatio="xMidYMid meet">
    @for (g of grid(); track g.y) {
      <line [attr.x1]="padL" [attr.x2]="w - padR" [attr.y1]="g.y" [attr.y2]="g.y"
        stroke="var(--line)" stroke-dasharray="3 3" />
      <text [attr.x]="padL - 6" [attr.y]="g.y + 3" text-anchor="end" font-size="10"
        font-family="Geist Mono, monospace" fill="var(--ink-3)">{{ g.label }}</text>
    }
    @for (b of bars(); track b.key) {
      <g>
        @for (s of b.segs; track s.label) {
          <rect [attr.x]="s.x" [attr.y]="s.y" [attr.width]="s.w" [attr.height]="s.h"
            [attr.fill]="s.color">
            <title>{{ s.label }}</title>
          </rect>
        }
        @if (b.total > 0) {
          <text [attr.x]="b.cx" [attr.y]="b.topY - 5" text-anchor="middle" font-size="10"
            font-family="Geist Mono, monospace" font-weight="600" fill="var(--ink)">{{ fmt(b.total) }}</text>
        }
        <text [attr.x]="b.cx" [attr.y]="h - 10" text-anchor="middle" font-size="10"
          fill="var(--ink-3)">{{ b.label }}</text>
      </g>
    }
  </svg>
} @else {
  <div class="no-data">Sem atividades neste período.</div>
}
