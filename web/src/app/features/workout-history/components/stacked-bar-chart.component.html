@if (buckets().length) {
  <svg [attr.viewBox]="'0 0 ' + w + ' ' + h" class="chart" preserveAspectRatio="xMidYMid meet">
    <defs>
      @for (c of gradColors(); track c) {
        <linearGradient [attr.id]="gradId(c)" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" [attr.stop-color]="topStop(c)" />
          <stop offset="1" [attr.stop-color]="baseStop(c)" />
        </linearGradient>
      }
    </defs>
    @for (g of grid(); track g.y) {
      <line [attr.x1]="padL" [attr.x2]="w - padR" [attr.y1]="g.y" [attr.y2]="g.y"
        stroke="var(--line)" stroke-width="1" stroke-opacity="0.45" />
      <text [attr.x]="padL - 6" [attr.y]="g.y + 3" text-anchor="end" font-size="10"
        font-family="Geist Mono, monospace" fill="var(--ink-3)">{{ g.label }}</text>
    }
    @for (b of displayBars(); track b.key) {
      <g>
        @for (s of b.segs; track s.label) {
          @if (s.top && s.h > 0.5) {
            <path [attr.d]="s.d" [attr.fill]="s.fill" [attr.fill-opacity]="s.opacity">
              <title>{{ s.label }} · {{ fmt(s.value) }}</title>
            </path>
          } @else {
            <rect [attr.x]="s.x" [attr.y]="s.y" [attr.width]="s.w" [attr.height]="s.h"
              [attr.fill]="s.fill" [attr.fill-opacity]="s.opacity">
              <title>{{ s.label }} · {{ fmt(s.value) }}</title>
            </rect>
          }
        }
        @if (b.total > 0) {
          <text [attr.x]="b.cx" [attr.y]="b.topY - 5" text-anchor="middle" font-size="10"
            font-family="Geist Mono, monospace" font-weight="600"
            [attr.fill]="'var(--ink)'" [attr.fill-opacity]="b.faded ? 0.55 : 1">{{ fmt(b.total) }}</text>
        }
        <text [attr.x]="b.cx" [attr.y]="h - 10" text-anchor="middle" font-size="10"
          [attr.fill]="b.faded ? 'var(--ink-4)' : 'var(--ink-3)'">{{ b.label }}</text>
      </g>
    }
  </svg>
} @else {
  <div class="no-data">Sem atividades neste período.</div>
}
