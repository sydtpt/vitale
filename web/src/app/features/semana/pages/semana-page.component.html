<div class="page">
  <rt-page-header
    [eyebrow]="weekRange()"
    [title]="greeting()"
  />

  <rt-week-highlights-card />

  <rt-weekly-recap-card />

  <div class="stats">
    <rt-big-stat icon="dumbbell" [color]="T.primary"
      label="Treinos" [value]="treinos().value" [suffix]="treinos().suffix" [delta]="treinos().pct" [deltaPos]="true"
      sub="concluídos na semana" />
    <rt-big-stat icon="flame" [color]="T.yellow"
      label="kcal/dia (média)" value="2.041" delta="−3% vs alvo" [deltaPos]="true"
      sub="Proteína média: 132g / 140g" />
    <rt-big-stat icon="target" [color]="T.green"
      label="Hábitos" [value]="habitos().value" [suffix]="habitos().suffix" [delta]="habitos().pct" [deltaPos]="true"
      sub="check-ins na semana" />
    <rt-big-stat icon="wallet" [color]="T.ink"
      label="Gasto semana" value="R$ 412" delta="−12% vs anterior" [deltaPos]="true"
      sub="Mercado: R$ 168 · mais gasto" />
  </div>

  <div class="grid-1-6-1">
    <rt-panel title="Hábitos & rotinas">
      <rt-habits-week-card />
    </rt-panel>
    <rt-panel title="Pontuação do dia">
      <rt-day-score-card />
    </rt-panel>
  </div>

  <div class="grid-2col">
    <rt-panel title="Cargas — últimas 6 semanas">
      <div panel-right class="tabs"><span class="t active">Cargas</span><span class="t">Corrida</span></div>
      <rt-lifts-chart />
    </rt-panel>
    <rt-panel title="Macros — média da semana">
      <span panel-right class="muted small">kcal: 2.041 / 2.200</span>
      <rt-macros-card />
    </rt-panel>
  </div>

  <rt-panel title="Bem-estar percebido — 30 dias">
    <span panel-right class="muted small">sono & dia · escala 1–5</span>
    <rt-ratings-trend-card />
  </rt-panel>

  <div class="grid-1-4-1">
    <rt-panel title="Gastos por categoria">
      <span panel-right class="muted small">R$ 1.864 de R$ 3.200 · 58% do mês</span>
      <rt-spend-by-category />
    </rt-panel>
    <rt-panel title="Compras recorrentes">
      <rt-recurring-list />
    </rt-panel>
  </div>

  <div class="grid-2col">
    <rt-panel title="Rotinas de casa"><rt-casa-list /></rt-panel>
    <rt-panel title="Metas de longo prazo">
      <span panel-right class="muted small">5 ativas</span>
      <rt-metas-list [compact]="true" />
    </rt-panel>
  </div>
</div>
