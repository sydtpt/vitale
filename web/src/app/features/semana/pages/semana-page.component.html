<div class="page">
  <rt-page-header
    eyebrow="Semana 21 · 18 — 24 maio"
    title="Bom dia, Cris."
    subtitle="Você está com 78 de 100 esta semana — uma das suas melhores."
  />

  <div class="stats">
    <rt-big-stat icon="dumbbell" [color]="T.primary"
      label="Treinos" value="3" suffix="/ 5" delta="60%" [deltaPos]="true"
      sub="Pernas hoje · corrida longa sábado" />
    <rt-big-stat icon="flame" [color]="T.yellow"
      label="kcal/dia (média)" value="2.041" delta="−3% vs alvo" [deltaPos]="true"
      sub="Proteína média: 132g / 140g" />
    <rt-big-stat icon="target" [color]="T.green"
      label="Hábitos" value="22" suffix="/ 28" delta="79%" [deltaPos]="true"
      sub="Yoga 3× · Leitura 4× · Meditar 2×" />
    <rt-big-stat icon="wallet" [color]="T.ink"
      label="Gasto semana" value="R$ 412" delta="−12% vs anterior" [deltaPos]="true"
      sub="Mercado: R$ 168 · mais gasto" />
  </div>

  <div class="grid-1-6-1">
    <rt-panel title="Hábitos & rotinas">
      <div panel-right class="legend-row">
        <span class="muted">menos</span>
        <span class="sw" style="background: #F6ECDC"></span>
        <span class="sw" style="background: color-mix(in srgb, #F25C2B 25%, #F6ECDC)"></span>
        <span class="sw" style="background: color-mix(in srgb, #F25C2B 50%, #F6ECDC)"></span>
        <span class="sw" style="background: color-mix(in srgb, #F25C2B 75%, #F6ECDC)"></span>
        <span class="sw" style="background: #F25C2B"></span>
        <span class="muted">mais</span>
      </div>
      <rt-heatmap />
      <div class="hm-foot">
        <span><b>34 check-ins</b> nesta semana · <b class="green">+9</b> vs. semana passada</span>
        <span class="muted">Cinza = pendente · contorno = hoje</span>
      </div>
    </rt-panel>
    <rt-panel title="Pontuação do dia">
      <rt-day-score-card />
    </rt-panel>
  </div>

  <div class="grid-2col">
    <rt-panel title="Cargas — últimas 6 semanas">
      <div panel-right class="tabs"><span class="t active">Cargas</span><span class="t">Corrida</span></div>
      <rt-lifts-chart />
    </rt-panel>
    <rt-panel title="Macros — média da semana">
      <span panel-right class="muted small">kcal: 2.041 / 2.200</span>
      <rt-macros-card />
    </rt-panel>
  </div>

  <div class="grid-1-4-1">
    <rt-panel title="Gastos por categoria">
      <span panel-right class="muted small">R$ 1.864 de R$ 3.200 · 58% do mês</span>
      <rt-spend-by-category />
    </rt-panel>
    <rt-panel title="Compras recorrentes">
      <rt-recurring-list />
    </rt-panel>
  </div>

  <div class="grid-2col">
    <rt-panel title="Rotinas de casa"><rt-casa-list /></rt-panel>
    <rt-panel title="Metas de longo prazo">
      <span panel-right class="muted small">5 ativas</span>
      <rt-metas-list [compact]="true" />
    </rt-panel>
  </div>
</div>
