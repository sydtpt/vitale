<div>
  <div class="top">
    <svg width="160" height="160" viewBox="0 0 160 160">
      @for (ring of rings(); track ring.r) {
        <circle cx="80" cy="80" [attr.r]="ring.r" fill="none" [attr.stroke]="ring.track" stroke-width="10"/>
        <circle cx="80" cy="80" [attr.r]="ring.r" fill="none" [attr.stroke]="ring.color" stroke-width="10"
                [attr.stroke-dasharray]="dash(ring.score, ring.r)" stroke-linecap="round" transform="rotate(-90 80 80)"/>
      } @empty {
        <!-- Sem Saúde sincronizada não há componente para desenhar: um sulco só
             segura o miolo do donut em vez de deixar o "—" solto no vazio. -->
        <circle cx="80" cy="80" r="68" fill="none" stroke="var(--line)" stroke-width="10"/>
      }
      <text x="80" y="78" text-anchor="middle" class="serif" font-size="38" fill="var(--ink)">
        {{ hasData() ? total() : '—' }}
      </text>
      <text x="80" y="96" text-anchor="middle" font-size="10" letter-spacing="1" font-weight="600" fill="var(--ink-3)">HOJE</text>
    </svg>
    <div class="legend">
      @for (r of rows(); track r.label) {
        <div class="row">
          <span class="dot" [style.background]="r.color"></span>
          <div class="flex">
            <div class="lbl">{{ r.label }}</div>
            <div class="sub">{{ r.sub }}</div>
          </div>
          <div class="cur mono">{{ r.cur }}</div>
        </div>
      } @empty {
        <div class="sub">Sincronize a aba Saúde no app para ver sua prontidão.</div>
      }
    </div>
  </div>
  @if (hasData()) {
    <div class="advice" [attr.data-tone]="advice().tone">
      <div class="advice-title">{{ advice().title }}</div>
      <div class="advice-text">{{ advice().text }}</div>
    </div>
  }

  <div class="footer">
    Prontidão do dia a partir de <b>sono</b>, <b>FC em repouso</b>, <b>VFC</b> e <b>anéis</b> do Apple Health.
  </div>
</div>
