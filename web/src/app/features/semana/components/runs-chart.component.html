<svg [attr.viewBox]="'0 0 ' + w + ' ' + h" class="chart">
  @for (g of grid; track g.v) {
    <g>
      <line [attr.x1]="padL" [attr.x2]="w - padR" [attr.y1]="g.y" [attr.y2]="g.y" stroke="#EFE6D8" stroke-dasharray="3 3"/>
      <text [attr.x]="padL - 6" [attr.y]="g.y + 3" text-anchor="end" font-size="10" font-family="Geist Mono, monospace" fill="#9C928A">{{ g.v }}km</text>
    </g>
  }
  @for (b of bars; track b.week) {
    <g>
      <rect [attr.x]="b.x" [attr.y]="b.y" [attr.width]="b.w" [attr.height]="b.h" rx="6" [attr.fill]="b.color"/>
      <text [attr.x]="b.cx" [attr.y]="h - 10" text-anchor="middle" font-size="10" fill="#9C928A">{{ b.week }}</text>
      <text [attr.x]="b.cx" [attr.y]="b.y - 4" text-anchor="middle" font-size="10" font-family="Geist Mono, monospace" font-weight="600" fill="#1F1B16">{{ b.km }}</text>
    </g>
  }
</svg>
