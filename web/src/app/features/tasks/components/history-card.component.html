<div class="card">
  <span class="ico" [style.background]="tint()">
    <rt-icon [name]="icon()" [size]="16" [color]="accent()" [strokeWidth]="1.9" />
  </span>

  <div class="body">
    <div class="name">{{ template().name }}</div>
    <div class="sub">{{ date() }} · {{ module() }}</div>
  </div>

  <div class="status" [class]="occurrence().status">
    <span class="badge">{{ statusLabel() }}</span>
  </div>

  <button class="btn-delete" (click)="onDelete()" title="Deletar do histórico">
    <rt-icon name="trash" [size]="18" [color]="'#E26A8A'" [strokeWidth]="1.5" />
  </button>
</div>
