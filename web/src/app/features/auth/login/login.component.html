<div class="page">
  <div class="card">
    <h1 class="logo">Vitale</h1>
    <p class="subtitle">Entre na sua conta</p>

    <form class="form" (ngSubmit)="submit()" #f="ngForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="voce@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="footer-link">
      Não tem conta? <a routerLink="/register">Criar conta</a>
    </p>
  </div>
</div>
